<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions Control — Admin Panel — Shakespeare Ideal School</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<aside class="sidebar" id="sidebarEl"></aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">📋 Admissions Control</div>
    <div class="topbar-meta">
      <a href="/admissions.html" class="view-site-btn" target="_blank">View Live Site →</a>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<div id="toast"></div>

<script src="/js/admin-shared.js"></script>
<script>
// ── Default data ──────────────────────────────
const DEFAULT_PROCESS_STEPS = [
  { step: '1', title: 'Collect Application Form',  description: 'Obtain the application form from the school office or download it from our website.' },
  { step: '2', title: 'Submit Documents',           description: 'Submit the completed form along with all required documents to the school office.' },
  { step: '3', title: 'Entrance Assessment',        description: 'Students appear for a simple aptitude assessment (Class III and above).' },
  { step: '4', title: 'Interview & Confirmation',   description: 'Parents and student meet with the Principal. Seat is confirmed upon fee payment.' }
];
const DEFAULT_DOCUMENTS = [
  'Birth Certificate (original + photocopy)',
  'Transfer Certificate from previous school',
  'Previous year report card / mark sheet',
  '4 passport-size photographs',
  'Aadhaar card (student + parent)',
  'Caste certificate (if applicable)',
  'Residential proof (Aadhaar / electricity bill)'
];

// ── State ─────────────────────────────────────
let state = { admissions: {} };

document.getElementById('sidebarEl').innerHTML = buildSidebar('pages', 'admissions');

async function init() {
  state.admissions = await apiGet('/api/data/admissions').catch(() => ({}));
  const d = state.admissions;
  if (!Array.isArray(d.processSteps) || !d.processSteps.length) d.processSteps = DEFAULT_PROCESS_STEPS;
  if (!Array.isArray(d.documents)    || !d.documents.length)    d.documents    = DEFAULT_DOCUMENTS;
  render();
}

// ── Render ────────────────────────────────────
function render() {
  const d  = state.admissions;
  const ps = d.processSteps || [];
  const dc = d.documents    || [];

  document.getElementById('mainContent').innerHTML = `
  <style>
    .ab-section { background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden; }
    .ab-section-header { display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:var(--sidebar-bg,#f8fafc);border-bottom:1px solid var(--border);gap:10px; }
    .ab-section-header-left { display:flex;align-items:center;gap:9px; }
    .ab-section-icon { font-size:17px;line-height:1; }
    .ab-section-title { font-size:13px;font-weight:700;color:var(--text);letter-spacing:.02em;text-transform:uppercase; }
    .ab-section-hint { font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0; }
    .ab-section-body { padding:18px; }
    .ab-row { display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:8px; }
    .ab-row:last-child { margin-bottom:0; }
    .ab-row .form-group { margin-bottom:0; }
    .ab-row .form-group label { font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block; }
    .ab-row .form-group input,.ab-row .form-group textarea { padding:6px 10px;font-size:13px; }
    .ab-del-btn { flex-shrink:0;align-self:center;background:none;border:1px solid #fca5a5;color:#ef4444;border-radius:6px;padding:5px 9px;font-size:14px;cursor:pointer;transition:background .15s;margin-top:16px; }
    .ab-del-btn:hover { background:#fef2f2; }
    .ab-empty { text-align:center;padding:18px;color:var(--muted);font-size:13px;font-style:italic; }
    .ab-add-btn { display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px; }
    .about-save-bar { display:flex;gap:10px;padding:20px 0 4px;border-top:1px solid var(--border);margin-top:4px; }
  </style>

  <div class="card" style="padding-bottom:8px;">
    <div class="card-title" style="margin-bottom:20px;">📋 Admissions Page — Full Content Editor</div>

    <!-- ① PAGE HERO -->
    <div class="ab-section">
      <div class="ab-section-header">
        <div class="ab-section-header-left">
          <span class="ab-section-icon">🎯</span>
          <span class="ab-section-title">Page Hero</span>
          <span class="ab-section-hint">— displayed at the top of the Admissions page</span>
        </div>
      </div>
      <div class="ab-section-body">
        <div class="form-grid" style="gap:12px;">
          <div class="form-group">
            <label>Hero Tag <span style="font-weight:400;color:var(--muted)">(small label above title)</span></label>
            <input id="ad-heroTag" type="text" value="${esc(d.heroTag || 'Join Our Family')}" placeholder="Join Our Family">
          </div>
          <div class="form-group">
            <label>Hero Title <span style="font-weight:400;color:var(--muted)">(main heading)</span></label>
            <input id="ad-heroTitle" type="text" value="${esc(d.heroTitle || 'Admissions 2025-26')}" placeholder="Admissions 2025-26">
          </div>
        </div>
      </div>
    </div>

    <!-- ② ADMISSIONS BANNER -->
    <div class="ab-section">
      <div class="ab-section-header">
        <div class="ab-section-header-left">
          <span class="ab-section-icon">📢</span>
          <span class="ab-section-title">Admissions Banner</span>
          <span class="ab-section-hint">— the highlighted announcement strip below the hero</span>
        </div>
      </div>
      <div class="ab-section-body">
        <div class="form-grid" style="gap:12px;">
          <div class="form-group">
            <label>Banner Title</label>
            <input id="ad-bannerTitle" type="text" value="${esc(d.bannerTitle || 'Admissions Now Open!')}" placeholder="Admissions Now Open!">
          </div>
          <div class="form-group">
            <label>Portal Status</label>
            <select id="ad-status">
              <option value="open"   ${(d.status || 'open') === 'open'   ? 'selected' : ''}>🟢 Open</option>
              <option value="closed" ${d.status === 'closed' ? 'selected' : ''}>🔴 Closed</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-top:12px;margin-bottom:12px;">
          <label>Banner Subtitle <span style="font-weight:400;color:var(--muted)">(line below the title)</span></label>
          <input id="ad-bannerSubtitle" type="text" value="${esc(d.bannerSubtitle || 'Applications are being accepted for LKG to Class X.')}" placeholder="Applications are being accepted for LKG to Class X.">
        </div>
        <div class="form-grid" style="gap:12px;">
          <div class="form-group">
            <label>Last Date</label>
            <input id="ad-date" type="text" value="${esc(d.lastDate || '')}" placeholder="e.g. 31 March 2025">
          </div>
          <div class="form-group">
            <label>Contact Phone</label>
            <input id="ad-phone" type="text" value="${esc(d.contactPhone || '')}" placeholder="e.g. +91 98765 43210">
          </div>
        </div>
        <div class="form-group" style="margin-top:12px;margin-bottom:0;">
          <label>Notice / Announcement <span style="font-weight:400;color:var(--muted)">(optional extra message shown on page)</span></label>
          <textarea id="ad-notice" rows="2" placeholder="e.g. Limited seats available. Early applications preferred.">${esc(d.notice || '')}</textarea>
        </div>
      </div>
    </div>

    <!-- ③ ADMISSION PROCESS STEPS -->
    <div class="ab-section">
      <div class="ab-section-header">
        <div class="ab-section-header-left">
          <span class="ab-section-icon">🪜</span>
          <span class="ab-section-title">Admission Process Steps</span>
          <span class="ab-section-hint">— step number · title · description</span>
        </div>
        <button type="button" class="btn btn-outline btn-sm ab-add-btn" id="addStepBtn">➕ Add Step</button>
      </div>
      <div class="ab-section-body">
        <div style="display:grid;grid-template-columns:60px 1fr 2fr 40px;gap:8px;margin-bottom:8px;padding:0 2px;">
          <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Step</span>
          <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Title</span>
          <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Description</span>
          <span></span>
        </div>
        <div id="stepsContainer">${ps.map(s => renderStepRow(s)).join('')}</div>
        ${ps.length === 0 ? `<div class="ab-empty" id="emptyStepsMsg">No steps yet. Click "Add Step" to start.</div>` : ''}
      </div>
    </div>

    <!-- ④ REQUIRED DOCUMENTS -->
    <div class="ab-section">
      <div class="ab-section-header">
        <div class="ab-section-header-left">
          <span class="ab-section-icon">📋</span>
          <span class="ab-section-title">Required Documents</span>
          <span class="ab-section-hint">— checklist items shown in the documents card</span>
        </div>
        <button type="button" class="btn btn-outline btn-sm ab-add-btn" id="addDocBtn">➕ Add Document</button>
      </div>
      <div class="ab-section-body">
        <div class="form-grid" style="gap:12px;margin-bottom:14px;">
          <div class="form-group">
            <label>Documents Card Heading</label>
            <input id="ad-docsHeading" type="text" value="${esc(d.docsHeading || '📋 Required Documents')}" placeholder="📋 Required Documents">
          </div>
        </div>
        <div id="docsContainer">${dc.map(doc => renderDocRow(doc)).join('')}</div>
        ${dc.length === 0 ? `<div class="ab-empty" id="emptyDocsMsg">No documents yet. Click "Add Document" to start.</div>` : ''}
      </div>
    </div>

    <!-- ⑤ DOWNLOAD FORM BUTTON -->
    <div class="ab-section">
      <div class="ab-section-header">
        <div class="ab-section-header-left">
          <span class="ab-section-icon">⬇️</span>
          <span class="ab-section-title">Download / Apply Button</span>
          <span class="ab-section-hint">— button shown at the bottom of the documents card</span>
        </div>
      </div>
      <div class="ab-section-body">
        <div class="form-grid" style="gap:12px;">
          <div class="form-group">
            <label>Button Label</label>
            <input id="ad-btnLabel" type="text" value="${esc(d.downloadBtnLabel || 'Download Form')}" placeholder="Download Form">
          </div>
          <div class="form-group">
            <label>Button URL / Link</label>
            <input id="ad-btnUrl" type="text" value="${esc(d.downloadBtnUrl || '/contact.html')}" placeholder="/contact.html or https://...">
          </div>
        </div>
      </div>
    </div>

    <!-- SAVE BAR -->
    <div class="about-save-bar">
      <button class="btn btn-success" id="saveAdmissionsBtn">💾 Save All Admissions Data</button>
      <button class="btn btn-outline" id="resetAdmissionsBtn" style="background:var(--bg)">↻ Reset to Defaults</button>
    </div>
  </div>`;

  document.getElementById('addStepBtn').onclick       = () => adAddStep();
  document.getElementById('addDocBtn').onclick        = () => adAddDoc();
  document.getElementById('saveAdmissionsBtn').onclick  = saveAdmissions;
  document.getElementById('resetAdmissionsBtn').onclick = resetAdmissionsToDefaults;
}

// ── Row renderers ──────────────────────────────
function renderStepRow(s) {
  return `<div class="ab-row" style="display:grid;grid-template-columns:60px 1fr 2fr 40px;gap:10px;align-items:center;">
    <div class="form-group"><input type="text" class="st-step" value="${esc(s.step||'')}" placeholder="1"></div>
    <div class="form-group"><input type="text" class="st-title" value="${esc(s.title||'')}" placeholder="Step title"></div>
    <div class="form-group"><input type="text" class="st-desc" value="${esc(s.description||'')}" placeholder="Brief description"></div>
    <button type="button" class="ab-del-btn" onclick="abRemoveRow(this)" title="Remove">✕</button>
  </div>`;
}

function renderDocRow(doc) {
  return `<div class="ab-row" style="display:grid;grid-template-columns:1fr 40px;gap:10px;align-items:center;">
    <div class="form-group"><input type="text" class="doc-value" value="${esc(doc||'')}" placeholder="e.g. Birth Certificate (original + photocopy)"></div>
    <button type="button" class="ab-del-btn" onclick="abRemoveRow(this)" title="Remove">✕</button>
  </div>`;
}

window.abRemoveRow = btn => btn.closest('.ab-row').remove();

window.adAddStep = function() {
  document.getElementById('stepsContainer').insertAdjacentHTML('beforeend', renderStepRow({}));
  const el = document.getElementById('emptyStepsMsg'); if (el) el.style.display = 'none';
};
window.adAddDoc = function() {
  document.getElementById('docsContainer').insertAdjacentHTML('beforeend', renderDocRow(''));
  const el = document.getElementById('emptyDocsMsg'); if (el) el.style.display = 'none';
};

// ── Collect helpers ────────────────────────────
function collectSteps() {
  return [...document.querySelectorAll('#stepsContainer .ab-row')].map(row => ({
    step:        row.querySelector('.st-step')?.value.trim()  || '',
    title:       row.querySelector('.st-title')?.value.trim() || '',
    description: row.querySelector('.st-desc')?.value.trim()  || ''
  })).filter(s => s.title || s.description);
}
function collectDocs() {
  return [...document.querySelectorAll('#docsContainer .ab-row')]
    .map(row => row.querySelector('.doc-value')?.value.trim() || '')
    .filter(Boolean);
}

// ── Save ───────────────────────────────────────
window.saveAdmissions = async function() {
  const updated = {
    ...state.admissions,
    heroTag:         document.getElementById('ad-heroTag')?.value.trim()        || '',
    heroTitle:       document.getElementById('ad-heroTitle')?.value.trim()      || '',
    bannerTitle:     document.getElementById('ad-bannerTitle')?.value.trim()    || '',
    bannerSubtitle:  document.getElementById('ad-bannerSubtitle')?.value.trim() || '',
    status:          document.getElementById('ad-status').value,
    lastDate:        document.getElementById('ad-date')?.value.trim()           || '',
    contactPhone:    document.getElementById('ad-phone')?.value.trim()          || '',
    notice:          document.getElementById('ad-notice')?.value.trim()         || '',
    docsHeading:     document.getElementById('ad-docsHeading')?.value.trim()    || '',
    downloadBtnLabel:document.getElementById('ad-btnLabel')?.value.trim()       || '',
    downloadBtnUrl:  document.getElementById('ad-btnUrl')?.value.trim()         || '',
    processSteps:    collectSteps(),
    documents:       collectDocs()
  };
  try {
    await api('/api/data/admissions', { method: 'PUT', body: JSON.stringify(updated) });
    state.admissions = updated;
    toast('Admissions page saved successfully.');
    render();
  } catch (err) {
    toast('Save failed: ' + err.message, 'error');
  }
};

window.resetAdmissionsToDefaults = async function() {
  if (!confirm('Reset all Admissions page content to defaults?')) return;
  const defaultAdmissions = {
    heroTag:          'Join Our Family',
    heroTitle:        'Admissions 2025-26',
    bannerTitle:      'Admissions Now Open!',
    bannerSubtitle:   'Applications are being accepted for LKG to Class X.',
    status:           'open',
    lastDate:         '31 March 2025',
    contactPhone:     '+91 98765 43210',
    notice:           '',
    docsHeading:      '📋 Required Documents',
    downloadBtnLabel: 'Download Form',
    downloadBtnUrl:   '/contact.html',
    processSteps:     JSON.parse(JSON.stringify(DEFAULT_PROCESS_STEPS)),
    documents:        JSON.parse(JSON.stringify(DEFAULT_DOCUMENTS))
  };
  try {
    await api('/api/data/admissions', { method: 'PUT', body: JSON.stringify(defaultAdmissions) });
    state.admissions = defaultAdmissions;
    toast('Admissions page reset to defaults.');
    render();
  } catch (err) {
    toast('Reset failed: ' + err.message, 'error');
  }
};

init();
</script>
</body>
</html>
